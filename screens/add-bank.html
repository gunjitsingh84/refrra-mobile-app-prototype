<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refrra – Add Bank Account</title><link rel="stylesheet" href="../css/styles.css"></head><body><main class="app-shell"><header class="app-header"><a class="icon-btn plain" href="business-payments.html">‹</a><div class="brand-mini"><img src="../assets/refrra-logo.svg"><span>Add Bank Account</span></div><span></span></header><section class="page"><form data-demo data-message="Bank account saved securely."><div class="stack"><div class="input-group"><label>Account Holder Name</label><input class="input" value="John Smith"></div><div class="input-group"><label>Bank Name</label><select class="select"><option>Commonwealth Bank</option><option>Westpac</option><option>Other</option></select></div><div class="input-group"><label>Account Number</label><input class="input" placeholder="1234 5678 9012"></div><div class="input-group"><label>Routing / IFSC / BSB</label><input class="input" placeholder="062-000 / IFSC: ..."></div><div class="input-group"><label>SWIFT / BIC</label><input class="input" placeholder="Optional"></div><div class="input-group"><label>Currency</label><select class="select"><option>AUD - Australian Dollar</option><option>INR - Indian Rupee</option></select></div><label class="small"><input type="checkbox"> Set as Default Account</label><button class="btn btn-primary btn-block">Save Account</button></div></form></section></main><script src="../js/app.js"></script></body></html>
