<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refrra – Add Business</title><link rel="stylesheet" href="../css/styles.css"></head><body><main class="app-shell"><header class="app-header"><a class="icon-btn plain" href="businesses.html">‹</a><div class="brand-mini"><img src="../assets/refrra-logo.svg"><span>Add Business</span></div><span></span></header><section class="page"><form data-demo data-message="Business saved successfully."><div class="center"><div class="card" style="border-style:dashed"><div style="font-size:38px">🏪</div><strong>Upload Business Photo</strong><div class="small muted">JPG, PNG up to 2MB</div></div></div><div class="section-title">Business Information</div><div class="form-grid"><div class="input-group full"><label>Business Name</label><input class="input" placeholder="Enter business name" required></div><div class="input-group full"><label>Business Category</label><select class="select"><option>Select category</option><option>Cafe</option><option>Retail</option><option>Restaurant</option><option>Services</option></select></div><div class="input-group full"><label>Description</label><textarea class="textarea" placeholder="Enter business description"></textarea></div><div class="input-group full"><label>Address 1</label><input class="input"></div><div class="input-group full"><label>Address 2</label><input class="input"></div><div class="input-group"><label>City</label><input class="input"></div><div class="input-group"><label>State</label><select class="select"><option>Select state</option></select></div><div class="input-group"><label>Zip</label><input class="input"></div><div class="input-group"><label>Country</label><select class="select"><option>Australia</option><option>India</option></select></div><div class="input-group"><label>Landline</label><input class="input"></div><div class="input-group"><label>Mobile</label><input class="input"></div></div><div class="section-title">Offer Details</div><div class="form-grid"><div class="input-group"><label>Discount %</label><input class="input" type="number" placeholder="15"></div><div class="input-group"><label>Referral %</label><input class="input" type="number" placeholder="5"></div></div><button class="btn btn-primary btn-block" style="margin-top:18px">Save Business</button></form></section></main><script src="../js/app.js"></script></body></html>
