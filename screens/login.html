<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refrra – Login</title><link rel="stylesheet" href="../css/styles.css"></head><body><main class="app-shell"><section class="page"><div class="center" style="padding-top:14px"><img class="logo-small" src="../assets/refrra-logo.svg" alt="Refrra"><h1 class="page-title">Welcome Back!</h1><p class="page-subtitle">Login to continue earning rewards.</p></div><div class="tabs"><button class="tab active" data-tab="email">Email</button><button class="tab" data-tab="phone">Phone</button></div><div data-panel="email"><form data-demo data-message="Login successful — opening dashboard." onsubmit="setTimeout(()=>location.href='dashboard.html',600)"><div class="stack"><div class="input-group"><label>Email Address</label><input class="input" type="email" placeholder="Enter your email"></div><div class="input-group"><label>Password</label><input class="input" type="password" placeholder="Enter your password"></div><a class="small green" href="forgot-password.html" style="text-align:right">Forgot Password?</a><button class="btn btn-primary btn-block">Login</button></div></form></div><div data-panel="phone" style="display:none"><form data-demo data-message="OTP sent." onsubmit="setTimeout(()=>location.href='dashboard.html',600)"><div class="stack"><div class="input-group"><label>Phone Number</label><input class="input" type="tel" placeholder="+91 Enter mobile number"></div><div class="grid-2"><button type="button" class="btn btn-secondary">Password</button><button type="button" class="btn btn-primary">OTP</button></div><div class="input-group"><label>OTP</label><input class="input" placeholder="6-digit OTP"></div><button class="btn btn-primary btn-block">Login</button></div></form></div><div class="center" style="margin-top:20px">New to Refrra? <a class="green" href="signup.html"><strong>Sign Up</strong></a></div></section></main><script src="../js/app.js"></script></body></html>
