<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refrra – Manage Profile</title><link rel="stylesheet" href="../css/styles.css"></head><body><main class="app-shell"><header class="app-header"><a class="icon-btn plain" href="account-settings.html">‹</a><div class="brand-mini"><img src="../assets/refrra-logo.svg"><span>Manage Profile</span></div><span></span></header><section class="page"><div class="center"><div class="avatar-placeholder" style="margin:auto">👤</div><button class="btn btn-secondary btn-sm" style="margin-top:8px">Change Photo</button></div><form data-demo data-message="Profile changes saved."><div class="section-title">Personal Information</div><div class="form-grid"><div class="input-group"><label>First Name</label><input class="input" value="John"></div><div class="input-group"><label>Last Name</label><input class="input" value="Smith"></div><div class="input-group full"><label>Profession</label><input class="input" value="Marketing Consultant"></div><div class="input-group full"><label>Email (Read Only)</label><input class="input" value="john.smith@email.com" disabled></div></div><div class="section-title">Address</div><div class="form-grid"><div class="input-group full"><label>Address 1</label><input class="input" value="123 Collins Street"></div><div class="input-group full"><label>Address 2</label><input class="input" value="Suite 4SA"></div><div class="input-group"><label>City</label><input class="input" value="Melbourne"></div><div class="input-group"><label>State</label><select class="select"><option>VIC</option><option>NSW</option></select></div><div class="input-group"><label>Zip</label><input class="input" value="3000"></div><div class="input-group"><label>Country</label><select class="select"><option>Australia</option><option>India</option></select></div></div><div class="section-title">Contact Information</div><div class="form-grid"><div class="input-group"><label>Landline</label><input class="input" value="+61 3 9876 5432"></div><div class="input-group"><label>Mobile</label><input class="input" value="+61 412 345 678"></div><div class="input-group full"><label>Profile Summary</label><textarea class="textarea">Passionate marketing professional with experience in digital marketing, brand strategy and customer engagement.</textarea></div></div><div class="section-title">Social Links <button type="button" class="btn btn-secondary btn-sm" data-toast="Add another social link">＋ Add</button></div><div class="stack"><div class="social-row"><input class="input" value="Facebook"><input class="input" value="https://facebook.com/johnsmith"><button type="button" class="btn btn-danger">×</button></div><div class="social-row"><input class="input" value="Instagram"><input class="input" value="https://instagram.com/johnsmith"><button type="button" class="btn btn-danger">×</button></div><div class="social-row"><input class="input" value="LinkedIn"><input class="input" value="https://linkedin.com/in/johnsmith"><button type="button" class="btn btn-danger">×</button></div></div><button class="btn btn-primary btn-block" style="margin-top:18px">Save Changes</button></form></section></main><script src="../js/app.js"></script></body></html>
